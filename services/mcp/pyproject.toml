[project]
name = "swiftforecast-mcp"
version = "0.1.0"
description = "Containerized MCP server for synthetic B2B ERP order forecasting."
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=1.12.0",
  "joblib>=1.4.2",
  "numpy>=1.26.0",
  "onnxruntime>=1.18.0",
  "starlette>=0.37.2",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["erp_forecast*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
